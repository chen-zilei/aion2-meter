[package]
name = "aion2-meter"
description = "Passive AION 2 DPS meter"
version.workspace = true
edition.workspace = true

[lib]
name = "aion2_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
meter-core = { path = "../crates/meter-core" }
parking_lot = "0.12"
pcap = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader"] }

[features]
default = ["live"]
# Live capture through Npcap/libpcap. Without it the app still runs in demo and replay mode.
live = ["dep:pcap"]
