name: Windows build

# Builds the Windows installer. Push a tag like v0.1.0 to publish a release.
# Every push to main and every pull request also builds it and keeps the installer as a downloadable artifact.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      NPCAP_SDK_VERSION: "1.15"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # wpcap.lib to link against. The DLL itself comes from the user's Npcap install at runtime.
      - name: Fetch Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "LIBPCAP_LIBDIR=$env:RUNNER_TEMP\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: npm ci
      - run: cargo test -p meter-core

      - name: Build installer (draft release on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AION 2 Meter ${{ github.ref_name }}
          releaseBody: Download the -setup.exe below. Install Npcap from npcap.com first.
          releaseDraft: false

      - name: Build installer (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: aion2-meter-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
